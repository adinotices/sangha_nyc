<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  (function(){
    var KEY = 'sangha-theme';
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch(e){}
    var theme = saved;
    if(!theme){
      var osDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var h = new Date().getHours();
      theme = (osDark || h >= 19 || h < 7) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<title>Page not found — Young Adult Sangha of New York Insight</title>
<meta name="description" content="That page doesn't exist. Find your way back to the Young Adult Sangha of New York Insight." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#f2efe4" id="themeColor" />

<link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png" />

<link rel="preload" href="/assets/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin />

<style>
  @font-face{font-family:Newsreader;font-style:normal;font-weight:300 500;font-display:swap;
    src:url(/assets/fonts/newsreader.woff2) format('woff2');
    unicode-range:U+0020-007E,U+00A0,U+2013-2014,U+2018-2019,U+201C-201D,U+2026;}
  @font-face{font-family:Newsreader;font-style:italic;font-weight:300 400;font-display:swap;
    src:url(/assets/fonts/newsreader-italic.woff2) format('woff2');
    unicode-range:U+0020-007E,U+00A0,U+2013-2014,U+2018-2019,U+201C-201D,U+2026;}
  @font-face{font-family:Figtree;font-style:normal;font-weight:400 600;font-display:swap;
    src:url(/assets/fonts/figtree.woff2) format('woff2');
    unicode-range:U+0020-007E,U+00A0,U+2013-2014,U+2018-2019,U+201C-201D,U+2026;}

  :root{
    --paper:#f2efe4; --ink:#212a20; --body:#4d5347; --faint:#676e5f; --line:#e1dac9;
    --moss:#7f9a72; --moss-deep:#55694e; --gold:#c2953f;
    --btn-bg:#55694e; --btn-fg:#f4f6ee; --focus:#2f6f4f;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --paper:#171b10; --ink:#f1efe2; --body:#c3c9b4; --faint:#8b9280; --line:#2b3121;
    --moss:#7fa06e; --moss-deep:#9fc28f; --gold:#d2a655;
    --btn-bg:#9fc28f; --btn-fg:#171b10; --focus:#9fc28f;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--body);font-family:Figtree,system-ui,sans-serif;
    font-size:18px;line-height:1.62;-webkit-font-smoothing:antialiased;text-align:center;
    padding:40px 26px;overflow-x:hidden;}
  .breath{position:fixed;top:50%;left:50%;width:min(520px,86vw);height:min(520px,86vw);
    transform:translate(-50%,-50%);pointer-events:none;z-index:0;}
  .breath div{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(127,154,114,.45);
    animation:breathe 9s ease-in-out infinite;}
  .breath div:nth-child(2){inset:14%;border-color:rgba(127,154,114,.35);animation-delay:.18s;}
  .breath div:nth-child(3){inset:30%;border-color:rgba(194,149,63,.4);animation-delay:.36s;}
  @keyframes breathe{0%,100%{transform:scale(.72);}50%{transform:scale(1.06);}}
  @media(prefers-reduced-motion:reduce){.breath div{animation:none;transform:scale(.92);}}

  .inner{position:relative;z-index:2;max-width:52ch;}
  .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--moss-deep);
    font-weight:600;margin:0 0 18px;display:inline-block;}
  h1{font-family:Newsreader,Georgia,serif;color:var(--ink);font-weight:300;line-height:1.1;
    letter-spacing:-.01em;font-size:clamp(34px,6vw,56px);margin:0 0 18px;}
  h1 em{font-style:italic;color:var(--moss-deep);}
  p{margin:0 0 32px;color:var(--body);}
  .btn{display:inline-block;font-size:15px;letter-spacing:.03em;text-decoration:none;
    padding:14px 26px;border-radius:100px;background:var(--btn-bg);color:var(--btn-fg);
    font-weight:600;transition:transform .15s ease, box-shadow .2s ease;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(85,105,78,.35);}
  a:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px;}
  @media(prefers-reduced-motion:reduce){.btn:hover{transform:none;}}
</style>
</head>
<body>
  <div class="breath" aria-hidden="true"><div></div><div></div><div></div></div>
  <main class="inner">
    <span class="eyebrow">404</span>
    <h1>This page has <em>wandered off</em>.</h1>
    <p>Like a thought in meditation — notice it, and gently come back.</p>
    <a class="btn" href="/">Return home</a>
  </main>
<script>
  (function(){
    var meta = document.getElementById('themeColor');
    if(meta) meta.setAttribute('content',
      document.documentElement.getAttribute('data-theme') === 'dark' ? '#171b10' : '#f2efe4');
  })();
</script>
</body>
</html>
